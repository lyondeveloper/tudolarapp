# The API returns the same error for an unknown account and a wrong password, so
# the form must stay on sign-in and must not reveal whether the account exists.
appId: com.lyondeveloper.mobile
name: Rejected credentials keep the user on sign-in
---
- launchApp:
    clearState: true
    # The session refresh token lives in the iOS Keychain, which clearState does
    # not touch; without this a previous flow's sign-in leaks into the next one.
    clearKeychain: true
- tapOn:
    id: 'sign-in-identifier'
- inputText: 'e2e-demo'
- tapOn:
    id: 'sign-in-password'
- inputText: 'definitely-the-wrong-password'
- tapOn:
    id: 'sign-in-submit'
- assertVisible: 'Invalid credentials'
- assertVisible:
    id: 'sign-in-submit'
