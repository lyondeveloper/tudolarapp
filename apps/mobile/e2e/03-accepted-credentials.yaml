# The seeded account is created by `npm run test:e2e:seed` in apps/api, which
# uses the project's own Argon2id parameters. Run `npm run test:e2e:api` first so
# the API is up against this worktree's database.
appId: com.lyondeveloper.mobile
name: Accepted credentials reach the authenticated screen
---
- launchApp:
    clearState: true
    # The session refresh token lives in the iOS Keychain, which clearState does
    # not touch; without this a previous flow's sign-in leaks into the next one.
    clearKeychain: true
- tapOn:
    id: 'sign-in-identifier'
- inputText: 'e2e-demo'
- tapOn:
    id: 'sign-in-password'
- inputText: 'e2e-demo-password'
- tapOn:
    id: 'sign-in-submit'
# iOS offers to save the credential after a successful sign-in, and that system
# dialog obscures the screen beneath it.
- runFlow:
    when:
      visible: 'Not Now'
    commands:
      - tapOn: 'Not Now'
- assertVisible: 'Signed in'
- assertVisible: 'E2E Demo'
